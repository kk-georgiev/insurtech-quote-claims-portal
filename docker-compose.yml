services:
  postgres:
    image: postgres:17-alpine
    container_name: motor-insurance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motor_insurance}
      POSTGRES_USER: ${POSTGRES_USER:-motor_insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - motor-insurance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motor-insurance-postgres-data:
