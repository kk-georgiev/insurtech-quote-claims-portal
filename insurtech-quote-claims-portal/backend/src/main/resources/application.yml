spring:
  application:
    name: motor-insurance-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/motor_insurance}
    username: ${DB_USERNAME:motor_insurance}
    password: ${DB_PASSWORD:local_development_only}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: Motor Insurance Quote & Claims Portal
    stage: foundation
