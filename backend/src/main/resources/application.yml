app:
  # Single source of truth for the dev-only CORS allow-list: read by both
  # shared/config/CorsConfig.java's CorsConfigurationSource (consumed by
  # SecurityConfig's filter chain, which now covers every request including
  # Actuator's) and management.endpoints.web.cors below. Keeping both
  # pointed at this one property prevents them drifting out of sync even
  # though the latter is likely redundant since Story 1.4 (see its comment).
  dev-cors-origins: http://localhost:5173,http://127.0.0.1:5173

# JWT issuance (Story 1.3, AD-11). `secret` mirrors the Postgres-credentials
# ${VAR:default} pattern from Story 1.1 - the fallback here is an insecure,
# clearly-labeled dev-only value so `mvn spring-boot:run` still works out of
# the box on a clean checkout; a real deployment overrides it via the actual
# JWT_SECRET environment variable (documented in .env.example). Must stay at
# least 32 bytes long - HS256 requires a >=256-bit signing key. Under the
# `docker` profile, DeploymentSecretsGuard fails startup fast if this - or
# the .env.example placeholder - is still active (epic-1-retro-item-10).
jwt:
  secret: ${JWT_SECRET:insecure-dev-only-default-jwt-secret-do-not-use-in-any-real-deployment-override-via-JWT_SECRET}
  expiration-hours: 8

# Offer validity (Story 6.2, Architecture Spine AD-6/FR-M3-02): the single
# configured source for how many days a calculated quote stays acceptable.
# QuoteService reads this - never a literal `14` at the call site - so the
# value is a configuration change, not a code change.
quote:
  offer-validity-days: 14

# Coverage period (Story 8.1, Architecture Spine AD-6/FR-M3-04): how many
# months a policy covers from its coverage start date. PolicyService reads
# this - never a literal `12` at a call site - and derives the (inclusive)
# coverage end as start + this many months - 1 day.
policy:
  coverage-months: 12

spring:
  application:
    name: motor-insurance-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:motorinsurance}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
      # Historically needed because Actuator endpoints were dispatched
      # separately from regular @RestController endpoints and didn't go
      # through shared/config/CorsConfig.java's WebMvcConfigurer. Since
      # Story 1.4, that config exposes a CorsConfigurationSource consumed
      # directly by SecurityConfig's filter chain, which now sits in front
      # of every request including /actuator/health - so this property is
      # likely redundant with that mechanism today. Left in place rather
      # than removed without re-verifying Actuator's CORS behavior end to
      # end; still sourced from the same app.dev-cors-origins property above
      # so it can't silently drift from the Security-chain config even if
      # both remain active.
      cors:
        allowed-origins: ${app.dev-cors-origins}
        allowed-methods: GET
  endpoint:
    health:
      show-details: never
