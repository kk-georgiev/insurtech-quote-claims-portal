# SPA fallback: React Router (AD-10) owns client-side routing, so any
# non-root path that doesn't match a static asset must still resolve to
# index.html and let the router handle it. An actual missing static asset
# (e.g. /assets/missing.js) still 404s normally since $uri is tried first.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built static assets (JS/CSS/etc., Vite's hashed /assets/ output) must
    # 404 normally when missing rather than falling back to index.html - only
    # unmatched *route* paths should get the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
